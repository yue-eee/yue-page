<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手掌 & 身高对比工具</title>
<style>
:root{--bg:#1a1a1a;--card:#242424;--text:#eee;--dim:#999;--border:#3a3a3a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:20px 16px 40px;
}
.wrap{max-width:520px;margin:0 auto;}
h2{text-align:center;font-size:1.1rem;letter-spacing:3px;margin-bottom:4px;}
.sub{text-align:center;font-size:.7rem;color:var(--dim);letter-spacing:2px;margin-bottom:14px;}

/* Card */
.card{
  background:var(--card);border-radius:16px;border:1px solid var(--border);
  padding:18px;margin-bottom:20px;
}

/* Input row */
.input-row{
  display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;
}
.input-row input{
  padding:8px 10px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.05);color:var(--text);font-size:.8rem;
  font-family:inherit;outline:none;min-width:0;
}
.input-row input:focus{border-color:#888;}
.input-row .name-in{width:80px;}
.input-row .len-in{width:70px;}
.input-row .label{font-size:.72rem;color:var(--dim);white-space:nowrap;letter-spacing:1px;}

/* Canvas */
.canvas-wrap{text-align:center;margin:10px 0;}
.canvas-wrap canvas{max-width:100%;}

/* Labels above canvas */
.canvas-labels{display:flex;justify-content:center;gap:20px;margin-bottom:6px;flex-direction:column;align-items:center;}
.label-bubble{
  padding:4px 14px;border-radius:14px;background:rgba(255,255,255,.9);
  color:#1a1a1a;font-size:.72rem;letter-spacing:1px;font-weight:600;
  white-space:nowrap;
}

/* Share btn */
.share-btn{
  display:block;width:100%;padding:14px;border-radius:30px;
  background:#1a1a1a;border:2px solid #555;color:#fff;
  font-size:.9rem;letter-spacing:3px;cursor:pointer;font-family:inherit;
  transition:all .3s;margin-top:8px;
}
.share-btn:hover{background:#333;border-color:#888;}
</style>
</head>
<body>
<div class="wrap">
  <h2>手掌 & 身高 对比工具</h2>
  <p class="sub">输入数据，直观对比差异</p>

  <!-- Module 1: Hand -->
  <div class="card">
    <h2 style="font-size:.95rem;">🖐️ 手掌大小对比</h2>
    <div class="input-row">
      <span class="label">姓名</span><input class="name-in" id="h1name" value="张三" placeholder="姓名">
      <span class="label">掌长</span><input class="len-in" id="h1len" type="number" value="18" min="10" max="30" step="0.1" placeholder="cm">
    </div>
    <div class="input-row">
      <span class="label">姓名</span><input class="name-in" id="h2name" value="李四" placeholder="姓名">
      <span class="label">掌长</span><input class="len-in" id="h2len" type="number" value="15" min="10" max="30" step="0.1" placeholder="cm">
    </div>
    <div class="canvas-wrap"><canvas id="handCanvas"></canvas></div>
  </div>

  <!-- Module 2: Height silhouette -->
  <div class="card">
    <h2 style="font-size:.95rem;">🧍 身高侧影对比</h2>
    <div class="input-row">
      <span class="label">男生姓名</span><input class="name-in" id="mName" value="小明" placeholder="姓名">
      <span class="label">身高</span><input class="len-in" id="mHt" type="number" value="175" min="100" max="250" step="0.1" placeholder="cm">
    </div>
    <div class="input-row">
      <span class="label">女生姓名</span><input class="name-in" id="fName" value="小红" placeholder="姓名">
      <span class="label">身高</span><input class="len-in" id="fHt" type="number" value="160" min="100" max="250" step="0.1" placeholder="cm">
    </div>
    <div class="canvas-wrap"><canvas id="bodyCanvas"></canvas></div>
  </div>

  <button class="share-btn" onclick="shareResult()">📸 分享结果</button>
</div>

<script>
// ==================== HAND CANVAS ====================
const handCanvas = document.getElementById('handCanvas');
const hctx = handCanvas.getContext('2d');

function drawSpreadHand(ctx, cx, cy, size, color, fill){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(size/150, size/150);

  // Palm body
  ctx.beginPath();
  ctx.ellipse(0, 15, 42, 55, 0, 0, Math.PI*2);
  if (fill){
    ctx.fillStyle = color;
    ctx.fill();
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  // Fingers - spread from palm
  const fingers = [
    {x:-32, y:-52, w:14, h:55, label:'拇指'},  // thumb
    {x:-16, y:-60, w:13, h:72, label:'食指'},  // index
    {x:2, y:-63, w:13, h:78, label:'中指'},    // middle
    {x:19, y:-58, w:13, h:68, label:'无名指'}, // ring
    {x:34, y:-48, w:12, h:55, label:'小指'},   // pinky
  ];

  for (const f of fingers){
    ctx.beginPath();
    // Rounded rectangle for finger
    const rx = f.x - f.w/2;
    const ry = f.y - f.h;
    const r = f.w/2;
    ctx.moveTo(rx + r, ry);
    ctx.lineTo(rx + f.w - r, ry);
    ctx.arc(rx + f.w - r, ry + r, r, -Math.PI/2, 0);
    ctx.lineTo(rx + f.w, f.y - r);
    ctx.arc(rx + f.w/2, f.y, r, 0, Math.PI);
    ctx.arc(rx + r, f.y - r, r, 0, -Math.PI/2, true);
    ctx.lineTo(rx, ry + r);
    ctx.arc(rx + r, ry + r, r, Math.PI, -Math.PI/2, true);
    ctx.closePath();

    if (fill){
      ctx.fillStyle = color;
      ctx.fill();
    } else {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // Wrist
  ctx.beginPath();
  ctx.moveTo(-22, 60);
  ctx.lineTo(-18, 90);
  ctx.lineTo(18, 90);
  ctx.lineTo(22, 60);
  if (fill){
    ctx.fillStyle = color;
    ctx.fill();
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  ctx.restore();
}

function renderHands(){
  const n1 = document.getElementById('h1name').value || '?';
  const n2 = document.getElementById('h2name').value || '?';
  const l1 = parseFloat(document.getElementById('h1len').value) || 18;
  const l2 = parseFloat(document.getElementById('h2len').value) || 15;

  const bigger = l1 >= l2 ? {name:n1, len:l1} : {name:n2, len:l2};
  const smaller = l1 >= l2 ? {name:n2, len:l2} : {name:n1, len:l1};

  const W = 320, H = 340;
  handCanvas.width = W; handCanvas.height = H;
  hctx.clearRect(0,0,W,H);

  // Background
  hctx.fillStyle = '#242424';
  hctx.fillRect(0,0,W,H);

  const cx = W/2, cy = H/2 + 10;
  const bigS = bigger.len * 9;
  const smS = smaller.len * 9;

  // Bigger hand (red outline, behind)
  drawSpreadHand(hctx, cx, cy, bigS, '#e05050', false);
  // Smaller hand (flesh pink fill, in front)
  drawSpreadHand(hctx, cx, cy, smS, '#f0c8b0', true);

  // Labels
  hctx.fillStyle = 'rgba(255,255,255,.92)';
  const lx = cx, ly1 = 30, ly2 = 55;
  // Bigger label on top
  const bw = Math.max(100, hctx.measureText(`${bigger.name} (${bigger.len}cm)`).width + 20);
  roundRect(hctx, lx - bw/2, ly1 - 10, bw, 22, 11);
  hctx.fill();
  hctx.fillStyle = '#1a1a1a';
  hctx.font = 'bold 12px "PingFang SC","Microsoft YaHei"';
  hctx.textAlign = 'center';
  hctx.fillText(`${bigger.name} (${bigger.len}cm)`, lx, ly1 + 5);

  // Smaller label below
  hctx.fillStyle = 'rgba(255,255,255,.92)';
  const sw = Math.max(100, hctx.measureText(`${smaller.name} (${smaller.len}cm)`).width + 20);
  roundRect(hctx, lx - sw/2, ly2 - 10, sw, 22, 11);
  hctx.fill();
  hctx.fillStyle = '#1a1a1a';
  hctx.fillText(`${smaller.name} (${smaller.len}cm)`, lx, ly2 + 5);
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.arc(x+w-r, y+r, r, -Math.PI/2, 0);
  ctx.lineTo(x+w, y+h-r);
  ctx.arc(x+w-r, y+h-r, r, 0, Math.PI/2);
  ctx.lineTo(x+r, y+h);
  ctx.arc(x+r, y+h-r, r, Math.PI/2, Math.PI);
  ctx.lineTo(x, y+r);
  ctx.arc(x+r, y+r, r, Math.PI, -Math.PI/2);
  ctx.closePath();
}

// ==================== BODY CANVAS ====================
const bodyCanvas = document.getElementById('bodyCanvas');
const bctx = bodyCanvas.getContext('2d');

function drawMaleSilhouette(ctx, cx, by, scale){
  ctx.save();
  ctx.translate(cx, by);
  const s = scale;

  // Head
  ctx.beginPath();
  ctx.arc(0, -90*s, 16*s, 0, Math.PI*2);
  ctx.fillStyle = '#5a5a5a';
  ctx.fill();

  // Neck
  ctx.fillRect(-6*s, -74*s, 12*s, 14*s);

  // Upper body (shoulders + torso)
  ctx.beginPath();
  ctx.moveTo(-28*s, -60*s); // left shoulder
  ctx.lineTo(-20*s, -20*s); // left waist
  ctx.lineTo(-14*s, 10*s);  // left hip
  ctx.lineTo(-10*s, 50*s);  // left leg top
  ctx.lineTo(-8*s, 90*s);   // left ankle
  ctx.lineTo(8*s, 90*s);    // right ankle
  ctx.lineTo(10*s, 50*s);   // right leg top
  ctx.lineTo(14*s, 10*s);   // right hip
  ctx.lineTo(20*s, -20*s);  // right waist
  ctx.lineTo(28*s, -60*s);  // right shoulder
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawFemaleSilhouette(ctx, cx, by, scale){
  ctx.save();
  ctx.translate(cx, by);
  const s = scale;

  // Head
  ctx.beginPath();
  ctx.arc(0, -85*s, 14*s, 0, Math.PI*2);
  ctx.fillStyle = '#f0c0c0';
  ctx.fill();

  // Hair (longer)
  ctx.beginPath();
  ctx.arc(0, -85*s, 14*s, Math.PI, 0);
  ctx.lineTo(16*s, -90*s);
  ctx.arc(0, -85*s, 15*s, 0, Math.PI);
  ctx.fill();

  // Neck
  ctx.fillRect(-5*s, -71*s, 10*s, 10*s);

  // Body
  ctx.beginPath();
  ctx.moveTo(-20*s, -61*s); // left shoulder (narrower)
  ctx.lineTo(-15*s, -40*s); // bust area
  ctx.lineTo(-22*s, -25*s); // bust left
  ctx.lineTo(-14*s, -10*s); // waist
  ctx.lineTo(-18*s, 10*s);  // hip (wider)
  ctx.lineTo(-10*s, 50*s);  // left leg top
  ctx.lineTo(-7*s, 85*s);   // left ankle
  ctx.lineTo(7*s, 85*s);    // right ankle
  ctx.lineTo(10*s, 50*s);   // right leg top
  ctx.lineTo(18*s, 10*s);   // right hip
  ctx.lineTo(14*s, -10*s);  // waist
  ctx.lineTo(22*s, -25*s);  // bust right
  ctx.lineTo(15*s, -40*s);  // chest
  ctx.lineTo(20*s, -61*s);  // right shoulder
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function renderBodies(){
  const mName = document.getElementById('mName').value || '男生';
  const fName = document.getElementById('fName').value || '女生';
  const mHt = parseFloat(document.getElementById('mHt').value) || 175;
  const fHt = parseFloat(document.getElementById('fHt').value) || 160;

  const W = 340, H = 420;
  bodyCanvas.width = W; bodyCanvas.height = H;
  bctx.clearRect(0,0,W,H);

  bctx.fillStyle = '#242424';
  bctx.fillRect(0,0,W,H);

  // Base height = 170cm → scale 1.0
  const baseH = 170;
  const mScale = mHt / baseH;
  const fScale = fHt / baseH;

  // Ground line
  const ground = H - 40;
  const mx = W * 0.32;
  const fx = W * 0.68;

  // Labels
  bctx.fillStyle = 'rgba(255,255,255,.92)';
  bctx.font = 'bold 11px "PingFang SC","Microsoft YaHei"';
  bctx.textAlign = 'center';

  const mLabW = Math.max(90, bctx.measureText(`${mName} (${mHt}cm)`).width + 16);
  roundRect(bctx, mx - mLabW/2, 8, mLabW, 22, 11);
  bctx.fill();
  bctx.fillStyle = '#1a1a1a';
  bctx.fillText(`${mName} (${mHt}cm)`, mx, 23);

  bctx.fillStyle = 'rgba(255,255,255,.92)';
  const fLabW = Math.max(90, bctx.measureText(`${fName} (${fHt}cm)`).width + 16);
  roundRect(bctx, fx - fLabW/2, 8, fLabW, 22, 11);
  bctx.fill();
  bctx.fillStyle = '#1a1a1a';
  bctx.fillText(`${fName} (${fHt}cm)`, fx, 23);

  // Ground
  bctx.strokeStyle = '#444';
  bctx.lineWidth = 1;
  bctx.beginPath();
  bctx.moveTo(20, ground);
  bctx.lineTo(W-20, ground);
  bctx.stroke();

  // Draw silhouettes (bottom of feet at ground)
  drawMaleSilhouette(bctx, mx, ground, mScale);
  drawFemaleSilhouette(bctx, fx, ground, fScale);

  // Height indicator lines
  bctx.setLineDash([4,4]);
  bctx.strokeStyle = 'rgba(255,255,255,.25)';
  bctx.lineWidth = 1;
  const mTop = ground - mScale * 200;
  const fTop = ground - fScale * 190;
  bctx.beginPath(); bctx.moveTo(mx, mTop); bctx.lineTo(mx, ground); bctx.stroke();
  bctx.beginPath(); bctx.moveTo(fx, fTop); bctx.lineTo(fx, ground); bctx.stroke();
  bctx.setLineDash([]);
}

// ==================== EVENT BINDING ====================
['h1name','h1len','h2name','h2len'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderHands);
});
['mName','mHt','fName','fHt'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderBodies);
});

// ==================== SHARE ====================
function shareResult(){
  // Merge both canvases into one image
  const hW = handCanvas.width, hH = handCanvas.height;
  const bW = bodyCanvas.width, bH = bodyCanvas.height;
  const totalW = Math.max(hW, bW);
  const totalH = hH + bH + 20;

  const merge = document.createElement('canvas');
  merge.width = totalW;
  merge.height = totalH;
  const mc = merge.getContext('2d');
  mc.fillStyle = '#1a1a1a';
  mc.fillRect(0,0,totalW,totalH);
  mc.drawImage(handCanvas, (totalW-hW)/2, 0);
  mc.drawImage(bodyCanvas, (totalW-bW)/2, hH + 20);

  // Download
  const link = document.createElement('a');
  link.download = '手掌身高对比.png';
  link.href = merge.toDataURL('image/png');
  link.click();
}

// ==================== INIT ====================
renderHands();
renderBodies();
</script>
</body>
</html>
