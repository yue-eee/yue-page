<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>领取你的健康余额</title>
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--text:#2b2f36;--dim:#8a90a0;--border:#e7eaf1;
  --accent:#6366f1;--accent-soft:#eef0ff;--risk:#ef4444;--risk-soft:#fee2e2;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:24px 16px 40px;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:520px;margin:0 auto;}
h1{text-align:center;font-size:1.35rem;letter-spacing:3px;margin-bottom:6px;color:var(--text);}
.sub{text-align:center;font-size:.72rem;color:var(--dim);letter-spacing:2px;margin-bottom:20px;}
.card{
  background:var(--card);border-radius:18px;border:1px solid var(--border);
  padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(30,40,80,.05);
}

/* 开始页 */
.hero-emoji{text-align:center;font-size:3rem;margin-bottom:10px;}
.desc{font-size:.88rem;line-height:1.8;color:var(--text);text-align:center;margin-bottom:14px;}
.desc b{color:var(--accent);}
.notice{font-size:.68rem;color:var(--dim);text-align:center;line-height:1.7;margin-bottom:18px;}

.btn{
  display:block;width:100%;padding:15px;border-radius:30px;
  background:var(--accent);border:none;color:#fff;
  font-size:.95rem;letter-spacing:3px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:all .3s;text-align:center;
}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{
  background:transparent;border:2px solid var(--border);color:var(--text);font-weight:400;letter-spacing:2px;
}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}

/* 做题页 */
.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.72rem;color:var(--dim);}
.progress-track{height:6px;background:#e5e8f0;border-radius:3px;overflow:hidden;margin-bottom:18px;}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s;border-radius:3px;}
.q-text{font-size:1.08rem;line-height:1.6;margin-bottom:18px;letter-spacing:1px;font-weight:600;}
.opt{
  display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;
  background:#f7f8fc;border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:.9rem;cursor:pointer;font-family:inherit;
  transition:all .2s;letter-spacing:1px;
}
.opt:hover{border-color:var(--accent);background:var(--accent-soft);}
.opt.picked{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}

/* 结果页 */
.result-hero{
  text-align:center;padding:28px 16px;border-radius:18px;margin-bottom:16px;
  border:1px solid var(--border);background:var(--card);position:relative;overflow:hidden;
}
.result-emoji{font-size:3.4rem;display:block;margin-bottom:8px;}
.result-name{font-size:1.5rem;font-weight:700;letter-spacing:4px;margin-bottom:12px;}
.verdict{font-size:.9rem;line-height:1.8;color:var(--text);max-width:360px;margin:0 auto 10px;}
.prescription{font-size:.78rem;color:var(--dim);font-style:italic;margin-bottom:14px;}
.risk-label{font-size:.66rem;color:var(--dim);margin-bottom:8px;letter-spacing:1px;}
.risk-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:4px;}
.risk-tag{
  font-size:.7rem;padding:4px 12px;border-radius:20px;
  background:var(--risk-soft);color:var(--risk);border:1px solid #fecaca;
  letter-spacing:1px;
}

/* 雷达图 */
.radar-card h3{font-size:.8rem;letter-spacing:2px;color:var(--dim);margin-bottom:6px;text-align:center;}
.radar-card p.hint{font-size:.66rem;color:var(--dim);text-align:center;margin-bottom:8px;}
.radar-wrap{text-align:center;}
.radar-wrap canvas{max-width:100%;}

/* 建议 */
.tips-card h3{font-size:.8rem;letter-spacing:2px;color:var(--dim);margin-bottom:12px;}
.tips-card li{list-style:none;font-size:.85rem;line-height:1.8;margin-bottom:8px;padding-left:20px;position:relative;color:var(--text);}
.tips-card li::before{content:'→';position:absolute;left:0;color:var(--accent);}

.footer-note{font-size:.66rem;color:var(--dim);text-align:center;line-height:1.8;margin-top:6px;}

/* 健康余额 */
.balance-card{text-align:center;padding:24px 20px;}
.balance-label{font-size:.75rem;color:var(--dim);letter-spacing:2px;margin-bottom:6px;}
.balance-num{font-size:2.8rem;font-weight:800;letter-spacing:1px;margin-bottom:8px;line-height:1;}
.balance-msg{font-size:.82rem;color:var(--dim);line-height:1.6;}

/* 何时就医 */
.when-card h3{font-size:.8rem;letter-spacing:2px;color:var(--dim);margin-bottom:10px;}
.when-card p{font-size:.85rem;line-height:1.8;color:var(--text);}
</style>
</head>
<body>
<div class="wrap">

  <!-- 开始页 -->
  <div id="screen-start">
    <h1>领取你的健康余额</h1>
    <p class="sub">你的健康本钱,可能没你想的那么多</p>
    <div class="card">
      <div class="hero-emoji">💰</div>
      <p class="desc">
        <b>5 分钟</b> · 21 道题,查查你的健康还剩多少本钱。<br>
        笑着做完,笑着被提醒。
      </p>
      <p class="notice">🔒 答案只留在你的手机里,不会上传<br>⚠️ 纯娱乐,非医疗诊断,身体不适请及时就医</p>
      <button class="btn" onclick="startQuiz()">开始鉴定</button>
    </div>
  </div>

  <!-- 做题页 -->
  <div id="screen-quiz" style="display:none;">
    <div class="quiz-head">
      <span id="q-count"></span>
      <span style="cursor:pointer;color:var(--accent);" onclick="prevQuestion()">‹ 上一题</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-text" id="q-text"></div>
    <div id="q-opts"></div>
  </div>

  <!-- 结果页 -->
  <div id="screen-result" style="display:none;">
    <!-- 健康余额 -->
    <div class="card balance-card">
      <p class="balance-label">💰 你的健康余额</p>
      <div class="balance-num" id="balance-num">--%</div>
      <p class="balance-msg" id="balance-msg"></p>
    </div>

    <div class="result-hero" id="result-hero">
      <span class="result-emoji" id="r-emoji"></span>
      <div class="result-name" id="r-name"></div>
      <div class="verdict" id="r-verdict"></div>
      <div class="prescription" id="r-prescription"></div>
      <div class="risk-label">💬 你的身体在悄悄提醒你(风险提示,非诊断)</div>
      <div class="risk-tags" id="r-risks"></div>
    </div>

    <div class="card radar-card">
      <h3>📊 你的健康画像</h3>
      <p class="hint">四个维度的生活方式风险(满分越高越要留意)</p>
      <div class="radar-wrap"><canvas id="radar" width="320" height="320"></canvas></div>
    </div>

    <div class="card when-card">
      <h3>🩺 什么时候该看医生</h3>
      <p id="r-when"></p>
    </div>

    <div class="card tips-card">
      <h3>💡 自救建议</h3>
      <ul id="r-tips"></ul>
    </div>

    <p class="footer-note" id="r-note"></p>

    <button class="btn" onclick="saveImage()" style="margin-top:14px;">🖼️ 保存结果图片</button>
    <button class="btn ghost" onclick="copyShare()" style="margin-top:10px;">📋 复制分享文案</button>
    <button class="btn ghost" onclick="restart()" style="margin-top:10px;">↺ 重新测试</button>
  </div>

</div>

<script>
// ==================== 7 种体质人设 ====================
const PROFILES = [
  {
    name:'月亮合伙人', emoji:'🌙', color:'#8b5cf6',
    verdict:'经鉴定,你已与月亮达成长期合作协议,肝脏夜间无偿加班。',
    prescription:'温馨提示:和月亮协商调休,实在不行给肝发点加班费。',
    risks:['心血管疾病','免疫力下降','内分泌紊乱'],
    tips:['固定作息时间,周末也别差太多','睡前 1 小时远离手机屏幕','保证每晚 7 小时睡眠'],
    when:'若长期白天嗜睡、心悸、血压偏高,建议就医'
  },
  {
    name:'血糖过山车车长', emoji:'🧋', color:'#f59e0b',
    verdict:'你的胰岛素已提交离职申请,血糖常年坐过山车。',
    prescription:'温馨提示:给胰岛素放个假,也让你的胰腺喘口气。',
    risks:['2型糖尿病','肥胖','脂肪肝'],
    tips:['逐步减糖,含糖饮料换成白水或无糖茶','控制精制碳水和甜点频率','定期体检关注血糖'],
    when:'若体检血糖/尿酸偏高,或出现多饮多尿、体重骤降,建议就医'
  },
  {
    name:'人体工学反向大师', emoji:'🪑', color:'#f472b6',
    verdict:'你用最魔幻的姿势,坐出了最贵的理疗费。',
    prescription:'温馨提示:每小时起来走走,别让椎间盘提前退休。',
    risks:['颈椎病','腰椎间盘突出','鼠标手'],
    tips:['每 45 分钟起身活动一下','调整坐姿与屏幕高度,避免低头驼背','坚持颈、腰部拉伸'],
    when:'若出现肢体麻木、放射性疼痛或无力,建议就医'
  },
  {
    name:'外卖终身会员', emoji:'🛵', color:'#ef4444',
    verdict:'你的厨房已改造成储物间,肠胃长期接待重油重盐贵宾。',
    prescription:'温馨提示:偶尔让你的胃也吃点"家常菜"。',
    risks:['高血压','高血脂','肥胖'],
    tips:['逐步减少外卖频率','控盐控油,清淡饮食','三餐规律,别暴饮暴食'],
    when:'若血压/血脂持续偏高,或胃痛反酸反复发作,建议就医'
  },
  {
    name:'屏幕原住民', emoji:'👀', color:'#38bdf8',
    verdict:'你的眼球比手机先没电,干眼症已在路上签收。',
    prescription:'温馨提示:多眨眼,别让眼睛和屏幕"绑定终生"。',
    risks:['干眼症','视疲劳','眼调节功能下降'],
    tips:['记住 20-20-20 法则:每 20 分钟看远处 20 秒','有意识地多眨眼','屏幕调暗,夜间开护眼模式'],
    when:'若视力骤降、持续眼痛或视物重影,建议就医'
  },
  {
    name:'情绪内耗冠军', emoji:'🌀', color:'#34d399',
    verdict:'你的脑内 24 小时循环演出,身体在替焦虑默默买单。',
    prescription:'温馨提示:给大脑开个免打扰,别让它深夜开例会。',
    risks:['焦虑','失眠','肠易激综合征'],
    tips:['用运动释放压力,别让情绪憋在体内','睡前冥想或放下手机,给大脑"下班"','长期紧绷可考虑寻求专业帮助'],
    when:'若情绪低落或焦虑持续两周以上,可拨打心理援助热线 12356 或寻求专业帮助'
  },
  {
    name:'过敏星球移民', emoji:'🤧', color:'#fbbf24',
    verdict:'你来自一个对空气、灰尘、猫毛都过敏的星球,换季就是你的渡劫日。',
    prescription:'温馨提示:随身备好纸巾,和过敏原保持"社交距离"。',
    risks:['过敏性鼻炎','哮喘','湿疹'],
    tips:['换季 / 花粉季出门戴口罩,减少外出','保持居家清洁,勤换床单被套','反复过敏建议查过敏原,及时就医'],
    when:'若出现呼吸困难、喉头水肿等严重过敏反应,请立即就医'
  }
];

// ==================== 5 个生活方式维度(雷达图) ====================
const DIMENSIONS = [
  {name:'饮食', emoji:'🍔', color:'#f59e0b'},
  {name:'久坐', emoji:'🪑', color:'#f472b6'},
  {name:'运动', emoji:'🏃', color:'#10b981'},
  {name:'作息', emoji:'🌙', color:'#8b5cf6'},
  {name:'身心', emoji:'🧠', color:'#38bdf8'},
];

// ==================== 题目(打乱顺序) ====================
// p = 人设索引, d = 维度索引, opts = [文字, 分数]
const QUESTIONS = [
  {p:0,d:3, q:'你通常几点睡?', opts:[['22 点前',0],['23 点左右',1],['凌晨 0-1 点',2],['凌晨 2 点后,月亮不睡我不睡',3]]},
  {p:4,d:4, q:'每天盯屏幕(手机+电脑)大概多久?', opts:[['4 小时以内',0],['4-8 小时',1],['8-12 小时',2],['12 小时以上,眼睛长屏幕上了',3]]},
  {p:2,d:1, q:'你每天大概坐多久?', opts:[['不到 4 小时',0],['4-6 小时',1],['6-9 小时',2],['9 小时以上,屁股和椅子长一起',3]]},
  {p:1,d:0, q:'奶茶 / 甜点一周几次?', opts:[['几乎不碰',0],['1-2 次',1],['3-5 次',2],['奶茶是我的命,天天续杯',3]]},
  {p:5,d:4, q:'睡前脑子会不停想事情吗?', opts:[['基本不会',0],['偶尔',1],['经常翻来覆去',2],['每天脑内 24h 循环演出',3]]},
  {p:3,d:0, q:'一周点几次外卖?', opts:[['几乎不点',0],['1-3 次',1],['4-6 次',2],['顿顿外卖,外卖小哥是我亲哥',3]]},
  {p:6,d:4, q:'换季或春天,你会喷嚏连击、眼睛发痒吗?', opts:[['完全不会',0],['偶尔打几个喷嚏',1],['经常,鼻子眼睛都难受',2],['一到换季就"渡劫"',3]]},

  {p:0,d:3, q:'睡前最后一件放不下的事是?', opts:[['闭眼就能睡',0],['看会儿手机',1],['刷视频停不下来',2],['追剧打游戏,天亮才罢休',3]]},
  {p:1,d:0, q:'渴了首选喝什么?', opts:[['白开水',0],['茶 / 无糖 / 黑咖啡',1],['果汁 / 运动饮料',2],['奶茶 / 可乐,无糖不快乐',3]]},
  {p:4,d:4, q:'盯屏多久会让眼睛休息一次?', opts:[['半小时内就远眺',0],['1-2 小时',1],['半天才想起来',2],['休息?眼睛不要可以捐',3]]},
  {p:2,d:1, q:'你平时看手机的姿势?', opts:[['平视举高',0],['微微低头',1],['低头驼背',2],['窝在床上/沙发扭成麻花',3]]},
  {p:6,d:4, q:'接触灰尘、猫毛、花粉时,你会?', opts:[['完全没反应',0],['偶尔鼻子痒',1],['打喷嚏流鼻涕',2],['起疹子 / 喘不过气',3]]},
  {p:5,d:4, q:'一点小事你会纠结多久?', opts:[['很快放下',0],['想一会儿',1],['纠结大半天',2],['反复咀嚼好几天',3]]},
  {p:3,d:0, q:'自己做饭的频率?', opts:[['天天做',0],['偶尔做',1],['几乎不做',2],['厨房是摆设,只会烧开水',3]]},

  {p:1,d:0, q:'面对甜食你的状态是?', opts:[['能克制',0],['偶尔想吃',1],['忍不住来一口',2],['上瘾,不吃浑身难受',3]]},
  {p:0,d:3, q:'你的作息规律吗?', opts:[['雷打不动固定睡',0],['基本规律',1],['周末彻底乱',2],['随心所欲,困了才睡',3]]},
  {p:4,d:4, q:'睡前最后看的是什么?', opts:[['书 / 不看屏幕',0],['偶尔刷一下',1],['刷到眼皮打架',2],['关了灯摸黑继续刷',3]]},
  {p:2,d:2, q:'你每周运动几次(出汗那种)?', opts:[['3 次以上,规律运动',0],['1-2 次',1],['偶尔动一动',2],['运动?不存在的',3]]},
  {p:6,d:4, q:'你的皮肤会莫名发痒、起红疹吗?', opts:[['基本不会',0],['偶尔',1],['经常',2],['常年湿疹 / 荨麻疹反复',3]]},
  {p:5,d:4, q:'你对未来的感觉是?', opts:[['挺坦然的',0],['偶尔焦虑',1],['常感压力',2],['长期紧绷,睡不好',3]]},
  {p:3,d:0, q:'你的口味偏好?', opts:[['偏清淡',0],['正常',1],['偏重口',2],['无辣不欢,重油重盐才过瘾',3]]},
];

// 每个维度的满分(题数 × 3)
const DIM_MAX = (()=>{ const m=new Array(DIMENSIONS.length).fill(0); QUESTIONS.forEach(q=>m[q.d]+=3); return m; })();

// ==================== 状态 ====================
let idx = 0;
let scores = new Array(7).fill(0);      // 7 人设得分
let dimScores = new Array(DIMENSIONS.length).fill(0);   // 各维度得分
let answers = new Array(QUESTIONS.length).fill(-1);

// ==================== 页面切换 ====================
function show(id){
  ['start','quiz','result'].forEach(s=>{
    document.getElementById('screen-'+s).style.display = (s===id)?'block':'none';
  });
}
function startQuiz(){
  idx = 0; scores = new Array(7).fill(0); dimScores = new Array(DIMENSIONS.length).fill(0); answers = new Array(QUESTIONS.length).fill(-1);
  show('quiz'); renderQuestion();
}
function restart(){ show('start'); }

// ==================== 做题 ====================
function renderQuestion(){
  const q = QUESTIONS[idx];
  document.getElementById('q-count').textContent = '第 ' + (idx+1) + ' / ' + QUESTIONS.length + ' 题';
  document.getElementById('progress-fill').style.width = ((idx) / QUESTIONS.length * 100) + '%';
  document.getElementById('q-text').textContent = q.q;
  const optBox = document.getElementById('q-opts');
  optBox.innerHTML = '';
  q.opts.forEach((opt, i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[idx]===i ? ' picked' : '');
    btn.textContent = opt[0];
    btn.onclick = ()=> selectOption(i);
    optBox.appendChild(btn);
  });
}
function selectOption(i){
  const q = QUESTIONS[idx];
  if(answers[idx] !== -1){ const old=q.opts[answers[idx]][1]; scores[q.p]-=old; dimScores[q.d]-=old; }
  answers[idx] = i;
  scores[q.p] += q.opts[i][1];
  dimScores[q.d] += q.opts[i][1];
  if(idx < QUESTIONS.length - 1){ idx++; renderQuestion(); }
  else { showResult(); }
}
function prevQuestion(){ if(idx===0) return; idx--; renderQuestion(); }

// ==================== 结果 ====================
let currentMain = 0;
let currentBalance = 100;

function calcBalance(){
  const total = scores.reduce((a,b)=>a+b,0);
  const max = 63; // 7 人设 × 3 题 × 满分 3
  return Math.max(20, Math.min(100, Math.round(100 - (total/max)*80)));
}
function balanceColor(b){ return b>=70 ? '#10b981' : (b>=50 ? '#f59e0b' : '#ef4444'); }
function balanceMsg(b){
  if(b>=90) return '你的健康本钱很足,继续保持!👏';
  if(b>=70) return '余额还不错,但有几个小漏洞该补补了';
  if(b>=50) return '余额告急,是时候给身体「充值」了';
  return '余额见底,身体在催你「续费」了';
}

function showResult(){
  const sorted = scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
  currentMain = sorted[0].i;

// ==================== 雷达图 ====================
function drawRadar(){
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 320;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = size, H = size;
  const cx = W/2, cy = H/2, R = 88;
  const N = DIMENSIONS.length;

  ctx.clearRect(0,0,W,H);

  // 网格(3 圈)
  ctx.strokeStyle = '#e5e8f0'; ctx.lineWidth = 1;
  for(let ring=1; ring<=3; ring++){
    ctx.beginPath();
    for(let i=0;i<N;i++){
      const ang = -Math.PI/2 + i*(Math.PI*2/N);
      const r = R*ring/3;
      const x = cx + Math.cos(ang)*r, y = cy + Math.sin(ang)*r;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath(); ctx.stroke();
  }
  // 轴线
  for(let i=0;i<N;i++){
    const ang = -Math.PI/2 + i*(Math.PI*2/N);
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(ang)*R, cy+Math.sin(ang)*R);
    ctx.stroke();
  }

  // 数据多边形
  const pts = DIMENSIONS.map((d,i)=>{
    const ratio = Math.min(1, dimScores[i]/DIM_MAX[i]);
    const ang = -Math.PI/2 + i*(Math.PI*2/N);
    const r = R*ratio;
    return {x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r};
  });
  ctx.beginPath();
  pts.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y); });
  ctx.closePath();
  ctx.fillStyle = 'rgba(99,102,241,.18)';
  ctx.fill();
  ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 2; ctx.stroke();

  // 数据点
  pts.forEach(pt=>{
    ctx.beginPath(); ctx.arc(pt.x,pt.y,4,0,Math.PI*2);
    ctx.fillStyle = '#6366f1'; ctx.fill();
  });

  // 轴标签(维度名 + 比例)
  ctx.fillStyle = '#2b2f36';
  ctx.font = '12px "PingFang SC","Microsoft YaHei"';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  DIMENSIONS.forEach((d,i)=>{
    const ang = -Math.PI/2 + i*(Math.PI*2/N);
    const lx = cx + Math.cos(ang)*(R+30);
    const ly = cy + Math.sin(ang)*(R+30);
    const ratio = Math.round(Math.min(1, dimScores[i]/DIM_MAX[i])*100);
    ctx.fillText(d.emoji+' '+d.name, lx, ly-8);
    ctx.fillStyle = '#8a90a0'; ctx.font = '10px "PingFang SC","Microsoft YaHei"';
    ctx.fillText(ratio+'%', lx, ly+8);
    ctx.fillStyle = '#2b2f36'; ctx.font = '12px "PingFang SC","Microsoft YaHei"';
  });
}

// ==================== 保存结果图片 ====================
function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const chars = text.split('');
  let line = '', lines = [];
  for(const ch of chars){
    if(ctx.measureText(line+ch).width > maxWidth && line !== ''){
      lines.push(line); line = ch;
    } else { line += ch; }
  }
  if(line) lines.push(line);
  if(maxLines) lines = lines.slice(0, maxLines);
  return lines;
}

function saveImage(){

  // 背景
  ctx.fillStyle = '#f4f6fb'; ctx.fillRect(0,0,W,H);

  // 顶部色带
  ctx.fillStyle = '#6366f1'; ctx.fillRect(0,0,W,150);
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei"';
  ctx.fillText('领取你的健康余额', W/2, 70);
  ctx.font = '14px "PingFang SC","Microsoft YaHei"';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText('—— 健康余额报告 ——', W/2, 115);

  // 人设
  let y = 210;
  ctx.textAlign = 'center';
  ctx.font = '72px serif';
  ctx.fillText(p.emoji, W/2, y);
  y += 70;
  ctx.fillStyle = p.color;
  ctx.font = 'bold 34px "PingFang SC","Microsoft YaHei"';
  ctx.fillText(p.name, W/2, y);
  y += 50;

  // 确诊文案(换行)
  ctx.fillStyle = '#2b2f36';
  ctx.font = '18px "PingFang SC","Microsoft YaHei"';
  const verdictLines = wrapText(ctx, p.verdict, W/2, y, W-120, 30);
  verdictLines.forEach(l=>{ ctx.fillText(l, W/2, y); y += 30; });
  y += 10;

  // 医嘱
  ctx.fillStyle = '#8a90a0';
  ctx.font = '15px "PingFang SC","Microsoft YaHei"';
  ctx.fillText(p.prescription, W/2, y);
  y += 40;

  // 分割线
  ctx.strokeStyle = '#e7eaf1'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(60,y); ctx.lineTo(W-60,y); ctx.stroke();
  y += 40;

  // 风险
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8a90a0'; ctx.font = '14px "PingFang SC","Microsoft YaHei"';
  ctx.fillText('⚠ 风险预警', 80, y);
  y += 34;
  ctx.fillStyle = '#ef4444'; ctx.font = '17px "PingFang SC","Microsoft YaHei"';
  ctx.fillText(p.risks.join('　·　'), 80, y);
  y += 50;

  // 建议
  ctx.fillStyle = '#8a90a0'; ctx.font = '14px "PingFang SC","Microsoft YaHei"';
  ctx.fillText('💡 自救建议', 80, y);
  y += 34;
  ctx.fillStyle = '#2b2f36'; ctx.font = '17px "PingFang SC","Microsoft YaHei"';
  p.tips.forEach(t=>{
    const lines = wrapText(ctx, t, 80, y, W-160, 30);
    lines.forEach(l=>{ ctx.fillText('· '+l, 80, y); y += 30; });
    y += 6;
  });

  // 底部免责
  ctx.textAlign = 'center';
  ctx.fillStyle = '#b0b4bf'; ctx.font = '12px "PingFang SC","Microsoft YaHei"';
  ctx.fillText('仅供娱乐,非医疗诊断', W/2, H-40);

  // 下载
  const a = document.createElement('a');
  a.download = '健康余额报告.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
